# Combined docker-compose for all ArbiScanner projects.
# Run from the ArbiScanner/ root directory:
#   docker compose up --build
#
# Required environment variables (set in a root .env file or shell):
#   TELEGRAM_BOT_TOKEN          - Telegram bot token for the notifier worker
#   MONGO_DB_CONNECTION_STRING  - MongoDB connection string for ArbitrageScanner
#                                 (defaults to the local mongodb service below)
#
# Port map:
#   5432  - PostgreSQL
#   5672  - RabbitMQ AMQP  | 15672 - RabbitMQ management UI
#   (Kafka 9092 is compose-network only; 127.0.0.1:8088 = Kafka UI, `--profile tools`)
#   6379  - Redis
#   27017 - MongoDB
#   3000  - Grafana
#   3001  - ArbiScannerWebApp React client
#   3002  - ArbiScannerAdminPannel React client
#   3100  - Loki
#   3200  - Grafana Tempo query API
#   4317  - Grafana Tempo OTLP gRPC
#   4318  - Grafana Tempo OTLP HTTP
#   8080  - ArbiScannerWebApp .NET API
#   8081  - ArbiScannerAdminPannel .NET API
#   8085  - Worker metrics (Prometheus scrape)
#   8087  - ArbiScanner.McpServer
#   8088  - ArbiScanner.AiAssistant
#   9090  - Prometheus
#
# The gateway nginx (web-client, port 80/443) also reverse-proxies:
#   /admin/      -> admin-client (React SPA, built with --base=/admin/)
#   /adminapi/   -> admin-api    (client's ADMIN_API_URL=/adminapi, see sample.env)
#   /grafana/    -> grafana      (GF_SERVER_SERVE_FROM_SUB_PATH=true)
#   /prometheus/ -> prometheus   (--web.route-prefix=/prometheus/, nginx basic-auth gated —
#                                  credentials come from PROMETHEUS_BASIC_AUTH_USER/PASSWORD)
#   /mcp/        -> mcp-server   (Streamable HTTP MCP transport, requires its own
#                                  arbiscanner-mcp Keycloak bearer token — see
#                                  ArbiScanner.McpServer/README.md)
#   /ai-hub/     -> ai-assistant (SignalR chat hub, same arbiscanner-web-spa bearer
#                                  token as every other ArbiScannerWeb.API call — see
#                                  ArbiScanner.AiAssistant/README.md)
#   /rabbitmq/   -> rabbitmq management UI (management.path_prefix=/rabbitmq)
#
# Keycloak (OIDC/OAuth2 for ArbiScannerWebApp, see keycloak/README.md) is NOT
# path-routed — its own /admin/{realm}/console paths collide with the /admin/
# route above, so it gets a dedicated subdomain (auth.<domain>) with its own
# nginx server block instead. See keycloak/README.md for one-time setup.

services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  postgres:
    image: postgres
    container_name: arbiscanner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: su1234
      POSTGRES_DB: ArbiScannerBot
    ports:
      # Bound to localhost only — reach it from outside via SSH tunnel, not a public port.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - arbiscanner

  rabbitmq:
    image: rabbitmq:3-management
    container_name: arbiscanner-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Serves the management UI behind the gateway nginx at /rabbitmq/
      - ./observability/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arbiscanner

  # ── Kafka (KRaft, single node) ────────────────────────────────────────────────
  # Event backbone being migrated to from RabbitMQ — see docs/architecture/kafka-migration-plan.md.
  # No host port is published and the listener is PLAINTEXT: it is reachable only on the
  # compose network. docker-compose.local.yml adds a localhost listener for local dev.

  kafka:
    image: apache/kafka:3.9.1
    container_name: arbiscanner-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Topics come from kafka-init only.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Single broker: internal topics cannot be replicated. Use 3 / min.insync.replicas=2 on a 3-broker cluster.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: "${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - arbiscanner

  # One-shot: creates the topics, then exits. Services that need topics to exist should use
  # `depends_on: kafka-init: condition: service_completed_successfully`.
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: arbiscanner-kafka-init
    restart: "no"
    entrypoint: ["/bin/sh", "/init-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PARTITIONS: "${KAFKA_TOPIC_PARTITIONS:-12}"
      KAFKA_REPLICATION_FACTOR: "${KAFKA_REPLICATION_FACTOR:-1}"
      KAFKA_MIN_INSYNC_REPLICAS: "${KAFKA_MIN_INSYNC_REPLICAS:-1}"
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - arbiscanner

  # Exposes consumer-group lag per partition (kafka_consumergroup_lag) for Prometheus/Grafana.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: arbiscanner-kafka-exporter
    restart: unless-stopped
    command:
      - --kafka.server=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - arbiscanner

  # Optional inspection UI, local only: `docker compose --profile tools up -d kafka-ui`,
  # then open http://localhost:8088. Bound to loopback; never expose it publicly (no auth).
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.4.2
    container_name: arbiscanner-kafka-ui
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: arbiscanner
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - arbiscanner

  redis:
    image: redis
    container_name: arbiscanner-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arbiscanner

  mongodb:
    image: mongo
    container_name: arbiscanner-mongodb
    restart: unless-stopped
    ports:
      # Bound to localhost only — reach it from outside via SSH tunnel, not a public port.
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGODB_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_PASSWORD}"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet",
             "-u", "${MONGODB_USERNAME}", "-p", "${MONGODB_PASSWORD}",
             "--authenticationDatabase", "admin",
             "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arbiscanner

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    image: ghcr.io/dimasdom/arbiscanner-keycloak:${KEYCLOAK_IMAGE_TAG:-latest}
    container_name: arbiscanner-keycloak
    restart: unless-stopped
    # First service in this compose file to get an explicit memory limit — a
    # JVM app idles well above the lean .NET services here, so cap it rather
    # than let it auto-size against host memory. Tune empirically.
    mem_limit: 384m
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      KC_HOSTNAME: "auth.arbiscannerwebapp.site"
      KC_PROXY_HEADERS: xforwarded
      # TLS terminates at the gateway nginx (web-client), not here.
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN_USER}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      JAVA_OPTS_APPEND: "-Xms64m -Xmx256m"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - arbiscanner

  # ── Monitoring ────────────────────────────────────────────────────────────────

  loki:
    image: grafana/loki
    container_name: arbiscanner-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - arbiscanner

  tempo:
    image: grafana/tempo:latest
    container_name: arbiscanner-tempo
    restart: unless-stopped
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - arbiscanner

  prometheus:
    image: prom/prometheus:latest
    container_name: arbiscanner-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # Served behind the gateway nginx at /prometheus/ — see nginx/nginx.conf
      - --web.external-url=https://www.arbiscannerwebapp.site/prometheus/
      - --web.route-prefix=/prometheus/
    volumes:
      - ./observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - arbiscanner

  grafana:
    image: grafana/grafana
    container_name: arbiscanner-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Served behind the gateway nginx at /grafana/ — see nginx/nginx.conf
      GF_SERVER_ROOT_URL: "https://www.arbiscannerwebapp.site/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ArbiScannerWebApp/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
      - tempo
      - prometheus
    networks:
      - arbiscanner

  # ── ArbiScannerWebApp ─────────────────────────────────────────────────────────

  web:
    build:
      context: .
      dockerfile: ArbiScannerWebApp/Dockerfile
    image: ghcr.io/dimasdom/arbiscanner-web:${WEB_IMAGE_TAG:-latest}
    container_name: arbiscanner-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SqlServer: "Host=postgres;Port=5432;Database=ArbiScannerBot;Username=postgres;Password=su1234"
      RabbitMq__Host: rabbitmq
      RabbitMq__Queue: spread_api
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      RabbitMq__Exchange: spread_fanout_exchange
      RabbitMq__RoutingKey: ""
      # RabbitMQ -> Kafka migration (docs/architecture/kafka-migration-plan.md). Kafka = live (default); RabbitMq = legacy path; Shadow = RabbitMQ live + side-effect-free Kafka consumer.
      Messaging__ServiceName: webapp
      Messaging__Consumer__Mode: "${MESSAGING_CONSUMER_MODE_WEB:-Kafka}"
      Kafka__BootstrapServers: kafka:9092
      Kafka__ClientId: arbiscanner-web
      Redis__Endpoint: redis:6379
      Cors__AllowedOrigins__0: "${WEB_CLIENT_URL}"
      Serilog__WriteTo__1__Name: GrafanaLoki
      Serilog__WriteTo__1__Args__uri: "${LOKI_URI}"
      Serilog__WriteTo__1__Args__labels__0__key: app
      Serilog__WriteTo__1__Args__labels__0__value: arbiscanner-web
      Serilog__WriteTo__1__Args__labels__1__key: env
      Serilog__WriteTo__1__Args__labels__1__value: production
      MongoDb__ConnectionString: "mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin"
      MongoDb__DatabaseName: "${MONGODB_DATABASE_NAME}"
      MongoDb__CurrentSpreadsCollection: "${MONGODB_CURRENT_SPREADS_COLLECTION}"
      MongoDb__SpreadsTickerCollection: "${MONGODB_SPREADS_TICKER_COLLECTION}"
      AdminApiUrl: http://admin-api:8080
      ClientUrl: "${WEB_CLIENT_URL}"
      # AdminService authenticates via OAuth2 Client Credentials against the
      # arbiscanner-admin-service client, whose service account is assigned
      # only the Manager realm role — [Authorize] (any role) endpoints, not
      # [Authorize(Roles = "Administrator")] ones. Replaces the old
      # Manager-username/password login (see keycloak/configure-admin-users.sh).
      Keycloak__AdminService__Authority: "${OIDC_AUTHORITY_ADMINPANEL}"
      Keycloak__AdminService__ClientId: "${KEYCLOAK_ADMIN_SERVICE_CLIENT_ID}"
      Keycloak__AdminService__ClientSecret: "${KEYCLOAK_ADMIN_SERVICE_CLIENT_SECRET}"
      # McpTokenService's Standard Token Exchange grant (arbiscanner-web realm,
      # arbiscanner-mcp client) — powers the "MCP Access" page's token generation.
      # ArbiScanner.McpServer itself only validates the tokens this mints, it
      # doesn't use this client id/secret — see keycloak/README.md step 9.
      Keycloak__McpExchange__Authority: "${OIDC_AUTHORITY_WEBAPP}"
      Keycloak__McpExchange__ClientId: "${KEYCLOAK_MCP_CLIENT_ID}"
      Keycloak__McpExchange__ClientSecret: "${KEYCLOAK_MCP_CLIENT_SECRET}"
      Jwt__Authority: "${OIDC_AUTHORITY_WEBAPP}"
      Jwt__Audience: "${OIDC_AUDIENCE_WEBAPP}"
      EmailSettings__SmtpServer: "${SMTP_SERVER}"
      EmailSettings__SmtpPort: "${SMTP_PORT}"
      EmailSettings__SenderEmail: "${SENDER_EMAIL}"
      EmailSettings__SenderPassword: "${SENDER_PASSWORD}"
      EmailSettings__SenderName: "${SENDER_NAME}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "arbiscanner-web"
      Observability__Enabled: "${OBSERVABILITY_ENABLED:-true}"
      VerboseLogging__Enabled: "${VERBOSE_CONSOLE_LOGS:-false}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      # Kafka is the live event path: wait for the broker and for the topics to exist.
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - arbiscanner

  web-client:
    build:
      # Root context: the gateway nginx config lives at ./nginx (repo root, not the
      # submodule) since it routes to all four submodules plus Grafana/Prometheus/RabbitMQ.
      context: .
      dockerfile: ArbiScannerWebApp/Dockerfile.client
      args:
        VITE_API_URL: ""
        VITE_OIDC_AUTHORITY: "${OIDC_AUTHORITY_WEBAPP}"
        VITE_OIDC_CLIENT_ID: "arbiscanner-web-spa"
        VITE_OIDC_REDIRECT_URI: "${WEB_CLIENT_URL}/auth/callback"
    image: ghcr.io/dimasdom/arbiscanner-web-client:${WEB_CLIENT_IMAGE_TAG:-latest}
    container_name: arbiscanner-web-client
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Basic-auth credentials for the /prometheus/ route — the container builds
      # /etc/nginx/prometheus.htpasswd from these at startup (see
      # nginx/40-generate-prometheus-htpasswd.sh). Leaving them
      # unset locks the route to everyone rather than leaving it unauthenticated.
      PROMETHEUS_BASIC_AUTH_USER: "${PROMETHEUS_BASIC_AUTH_USER}"
      PROMETHEUS_BASIC_AUTH_PASSWORD: "${PROMETHEUS_BASIC_AUTH_PASSWORD}"
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - web
      - admin-client
      - grafana
      - prometheus
      - rabbitmq
      - keycloak
    networks:
      - arbiscanner

  certbot:
    image: certbot/certbot
    container_name: arbiscanner-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on:
      - web-client

  # ── ArbiScannerAdminPannel ────────────────────────────────────────────────────

  admin-api:
    build:
      context: .
      dockerfile: ArbiScannerAdminPannel/Dockerfile
    image: ghcr.io/dimasdom/arbiscanner-admin-api:${ADMIN_API_IMAGE_TAG:-latest}
    container_name: arbiscanner-admin-api
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=ArbiScannerBot;Username=postgres;Password=su1234"
      ConnectionStrings__AdminConnection: "Host=postgres;Port=5432;Database=ArbiScannerAdminPanelDb;Username=postgres;Password=su1234"
      Redis__Endpoint: redis:6379
      Cors__AllowedOrigins: "${ADMIN_CLIENT_URL}"
      Jwt__Authority: "${OIDC_AUTHORITY_ADMINPANEL}"
      Jwt__Audience: "${OIDC_AUDIENCE_ADMINPANEL}"
      # UsersService deletes the Keycloak identity (arbiscanner-web realm) when an
      # admin deletes a user, so the local shadow-row delete actually frees the
      # account/email up instead of leaving it stuck (see keycloak/README.md).
      Keycloak__WebRealmAdmin__Authority: "${OIDC_AUTHORITY_WEBAPP}"
      Keycloak__WebRealmAdmin__ClientId: "${KEYCLOAK_WEB_ADMIN_OPS_CLIENT_ID}"
      Keycloak__WebRealmAdmin__ClientSecret: "${KEYCLOAK_WEB_ADMIN_OPS_CLIENT_SECRET}"
      OxaPay__BaseUrl: "${OXAPAY_BASE_URL}"
      OxaPay__MerchantApiKey: "${OXAPAY_MERCHANT_API_KEY}"
      OxaPay__DefaultCurrency: "${OXAPAY_DEFAULT_CURRENCY}"
      OxaPay__DefaultLifetime: "${OXAPAY_DEFAULT_LIFETIME}"
      OxaPay__Sandbox: "${OXAPAY_SANDBOX}"
      Serilog__WriteTo__1__Name: GrafanaLoki
      Serilog__WriteTo__1__Args__uri: "${LOKI_URI}"
      Serilog__WriteTo__1__Args__labels__0__key: app
      Serilog__WriteTo__1__Args__labels__0__value: arbiscanner-admin
      Serilog__WriteTo__1__Args__labels__1__key: env
      Serilog__WriteTo__1__Args__labels__1__value: production
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "arbiscanner-admin"
      Observability__Enabled: "${OBSERVABILITY_ENABLED:-true}"
      VerboseLogging__Enabled: "${VERBOSE_CONSOLE_LOGS:-false}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - arbiscanner

  admin-client:
    build:
      context: ArbiScannerAdminPannel
      dockerfile: Dockerfile.client
      args:
        VITE_API_URL: "${ADMIN_API_URL}"
        VITE_OIDC_AUTHORITY: "${VITE_OIDC_AUTHORITY_ADMINPANEL}"
        VITE_OIDC_CLIENT_ID: "${VITE_OIDC_CLIENT_ID_ADMINPANEL}"
        VITE_OIDC_REDIRECT_URI: "${VITE_OIDC_REDIRECT_URI_ADMINPANEL}"
    image: ghcr.io/dimasdom/arbiscanner-admin-client:${ADMIN_CLIENT_IMAGE_TAG:-latest}
    container_name: arbiscanner-admin-client
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - admin-api
    networks:
      - arbiscanner

  # ── TelegramNotifierApp ───────────────────────────────────────────────────────

  telegram-notifier:
    build:
      context: .
      dockerfile: ArbiScanner.TelegramNotifierApp/Dockerfile
    image: ghcr.io/dimasdom/arbiscanner-telegram-notifier:${TELEGRAM_NOTIFIER_IMAGE_TAG:-latest}
    container_name: arbiscanner-telegram-notifier
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      ConnectionStrings__PostgreSqlConnection: "Host=postgres;Port=5432;Database=ArbiScannerBot;Username=postgres;Password=su1234"
      RabbitMq__Host: rabbitmq
      RabbitMq__Queue: spread_telegram
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      RabbitMq__Exchange: spread_fanout_exchange
      RabbitMq__RoutingKey: ""
      # RabbitMQ -> Kafka migration (docs/architecture/kafka-migration-plan.md). RabbitMq = unchanged; Shadow = also run a side-effect-free Kafka consumer + parity check.
      Messaging__ServiceName: telegram
      Messaging__Consumer__Mode: "${MESSAGING_CONSUMER_MODE_TELEGRAM:-Kafka}"
      Kafka__BootstrapServers: kafka:9092
      Kafka__ClientId: arbiscanner-telegram-notifier
      Redis__Endpoint: redis:6379
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN}"
      Serilog__WriteTo__1__Name: GrafanaLoki
      Serilog__WriteTo__1__Args__uri: "${LOKI_URI}"
      Serilog__WriteTo__1__Args__labels__0__key: app
      Serilog__WriteTo__1__Args__labels__0__value: arbiscanner-telegram-notifier
      Serilog__WriteTo__1__Args__labels__1__key: env
      Serilog__WriteTo__1__Args__labels__1__value: production
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "arbiscanner-telegram-notifier"
      Observability__Enabled: "${OBSERVABILITY_ENABLED:-true}"
      VerboseLogging__Enabled: "${VERBOSE_CONSOLE_LOGS:-false}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      # Kafka is the live event path: wait for the broker and for the topics to exist.
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - arbiscanner

  # ── ArbitrageScanner ──────────────────────────────────────────────────────────

  arbitrage-scanner:
    build:
      context: ArbitrageScanner
      dockerfile: ArbitrageScanner.Worker/Dockerfile
    image: ghcr.io/dimasdom/arbitrage-scanner:${ARBITRAGE_SCANNER_IMAGE_TAG:-latest}
    container_name: arbiscanner-arbitrage-scanner
    restart: unless-stopped
    ports:
      - "8086:8085"
    environment:
      MongoDb_ConnectionString: "mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@mongodb:27017/ArbitrageScanner?authSource=admin"
      RABBITMQ_HOST: rabbitmq
      # RabbitMQ -> Kafka migration (docs/architecture/kafka-migration-plan.md). Default = Kafka only. Both true = dual publish (RabbitMQ authoritative).
      Messaging__Publish__RabbitMq: "${MESSAGING_PUBLISH_RABBITMQ:-false}"
      Messaging__Publish__Kafka: "${MESSAGING_PUBLISH_KAFKA:-true}"
      Kafka__BootstrapServers: kafka:9092
      Kafka__ClientId: arbiscanner-arbitrage-scanner
      Arbitrage__SpreadSize: "${ARBITRAGE_SPREAD_SIZE}"
      Arbitrage__PositionSize: "${ARBITRAGE_POSITION_SIZE}"
      Arbitrage__KeepWatchingSpread: "${ARBITRAGE_KEEP_WATCHING_SPREAD}"
      Arbitrage__ThreadCount: "${ARBITRAGE_THREAD_COUNT}"
      Arbitrage__FundingThresholdRatio: "${ARBITRAGE_FUNDING_THRESHOLD_RATIO}"
      Arbitrage__TelegramToken: "${TELEGRAM_BOT_TOKEN}"
      Arbitrage__ChatId: "${ARBITRAGE_CHAT_ID}"
      Arbitrage__Futures: "${ARBITRAGE_FUTURES}"
      Arbitrage__Funding: "${ARBITRAGE_FUNDING}"
      Arbitrage__Spot: "${ARBITRAGE_SPOT}"
      ARBITRAGE_EXCHANGE_LIST: "${ARBITRAGE_EXCHANGE_LIST}"
      ARBITRAGE_PROXY_LIST: "${ARBITRAGE_PROXY_LIST}"
      VerboseLogging__Enabled: "${VERBOSE_CONSOLE_LOGS:-false}"
      Serilog__WriteTo__1__Name: GrafanaLoki
      Serilog__WriteTo__1__Args__uri: "${LOKI_URI}"
      Serilog__WriteTo__1__Args__labels__0__key: app
      Serilog__WriteTo__1__Args__labels__0__value: arbiscanner-arbitrage-scanner
      Serilog__WriteTo__1__Args__labels__1__key: env
      Serilog__WriteTo__1__Args__labels__1__value: production
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "arbiscanner-arbitrage-scanner"
      Observability__Enabled: "${OBSERVABILITY_ENABLED:-true}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      # Kafka is the live event path: wait for the broker and for the topics to exist.
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - arbiscanner

  # ── ArbiScanner.McpServer ────────────────────────────────────────────────────

  mcp-server:
    build:
      context: ArbiScanner.McpServer
      dockerfile: Dockerfile
    image: ghcr.io/dimasdom/arbiscanner-mcp-server:${MCP_SERVER_IMAGE_TAG:-latest}
    container_name: arbiscanner-mcp-server
    restart: unless-stopped
    ports:
      - "8087:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Plain OAuth resource server — validates whatever long-lived (30-day)
      # personal access token a caller presents (minted by ArbiScannerWeb's
      # "MCP Access" page) and forwards it unchanged to ArbiScannerWeb.API.
      # This container never talks to Keycloak itself, so it needs no client
      # id/secret of its own. See ArbiScanner.McpServer/README.md.
      Keycloak__Authority: "${OIDC_AUTHORITY_MCP}"
      Keycloak__Audience: "${OIDC_AUDIENCE_MCP}"
      WebApi__BaseUrl: "${MCP_WEB_API_URL}"
      Serilog__WriteTo__1__Name: GrafanaLoki
      Serilog__WriteTo__1__Args__uri: "${LOKI_URI}"
      Serilog__WriteTo__1__Args__labels__0__key: app
      Serilog__WriteTo__1__Args__labels__0__value: arbiscanner-mcp
      Serilog__WriteTo__1__Args__labels__1__key: env
      Serilog__WriteTo__1__Args__labels__1__value: production
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "arbiscanner-mcp"
      Observability__Enabled: "${OBSERVABILITY_ENABLED:-true}"
      VerboseLogging__Enabled: "${VERBOSE_CONSOLE_LOGS:-false}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      web:
        condition: service_healthy
      keycloak:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - arbiscanner

  # ── ArbiScanner.AiAssistant ──────────────────────────────────────────────────

  ai-assistant:
    build:
      context: ArbiScanner.AiAssistant
      dockerfile: Dockerfile
    image: ghcr.io/dimasdom/arbiscanner-ai-assistant:${AI_ASSISTANT_IMAGE_TAG:-latest}
    container_name: arbiscanner-ai-assistant
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Validates the same arbiscanner-web-spa-audienced token the browser already
      # holds for every other ArbiScannerWeb.API call — no new Keycloak client.
      Jwt__Authority: "${OIDC_AUTHORITY_WEBAPP}"
      Jwt__Audience: "${OIDC_AUDIENCE_WEBAPP}"
      # Only used to call POST /api/McpToken/Generate, which exchanges the caller's
      # own token for one scoped to arbiscanner-mcp — see ArbiScanner.AiAssistant/README.md.
      WebApi__BaseUrl: "${MCP_WEB_API_URL}"
      McpServer__BaseUrl: "http://mcp-server:8080/mcp"
      OpenRouter__ApiKey: "${OPENROUTER_API_KEY}"
      OpenRouter__Model: "${OPENROUTER_MODEL}"
      Cors__AllowedOrigins__0: "${WEB_CLIENT_URL}"
      Serilog__WriteTo__1__Name: GrafanaLoki
      Serilog__WriteTo__1__Args__uri: "${LOKI_URI}"
      Serilog__WriteTo__1__Args__labels__0__key: app
      Serilog__WriteTo__1__Args__labels__0__value: arbiscanner-ai-assistant
      Serilog__WriteTo__1__Args__labels__1__key: env
      Serilog__WriteTo__1__Args__labels__1__value: production
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "arbiscanner-ai-assistant"
      Observability__Enabled: "${OBSERVABILITY_ENABLED:-true}"
      VerboseLogging__Enabled: "${VERBOSE_CONSOLE_LOGS:-false}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      web:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - arbiscanner

volumes:
  postgres-data:
  rabbitmq-data:
  kafka-data:
  mongodb-data:
  loki-data:
  grafana-data:
  tempo-data:
  prometheus-data:
  certbot-etc:
  certbot-www:

networks:
  arbiscanner:
    driver: bridge
