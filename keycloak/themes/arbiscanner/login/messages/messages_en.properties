# Overrides a handful of keycloak.v2's stock English strings to match the old
# pre-Keycloak app UI's copy, plus a few new keys used only by this theme's
# login.ftl / register.ftl / login-reset-password.ftl overrides.
#
# doLogIn and passwordConfirm are stock keys reused across other flows too
# (e.g. password-update forms) — overridden here because "Login" / "Confirm
# Password" (vs stock "Sign In" / "Confirm password") is the desired wording
# everywhere in this realm, not just on this one page.
doLogIn=Login
passwordConfirm=Confirm Password
registerTitle=Create an account

arbForgotPassword=Forgot password?
arbSignIn=Sign in
arbResetTitle=Reset your password
arbSendCode=Send code
