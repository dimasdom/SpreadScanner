# Extends Keycloak's own default theme — inherits all templates, PatternFly
# vendor CSS, and behavior (webauthn, OTP, social login, etc.) except for
# what's explicitly overridden below. Only login.ftl, register.ftl and
# login-reset-password.ftl are overridden (footer link layout only — see
# comments in each file); everything else (email flows, OTP setup, WebAuthn,
# admin console) falls through to keycloak.v2 unchanged.
parent=keycloak.v2

# keycloak.v2's own stylesheet loads first (still needed for layout/grid/
# form-control structure), our override loads second so it wins the cascade.
styles=css/styles.css css/arbiscanner.css

# Lets template.ftl declare "light dark" in its <meta name="color-scheme">
# (instead of "light" only) and toggle keycloak.v2's pf-v5-theme-dark class
# live off prefers-color-scheme — matching arbiscanner.css, which follows
# that same OS preference rather than forcing dark. See the top-of-file
# comment in arbiscanner.css for why this page can't just read the app's own
# light/dark toggle instead.
darkMode=true

# A handful of keycloak.v2's own inherited base-theme templates (e.g.
# login-idp-link-confirm.ftl — the "an account with this email already
# exists, how do you want to continue?" screen shown on first Google sign-in
# when duplicateEmailsAllowed is false) reference kcButtonDefaultClass /
# kcButtonLargeClass, but keycloak.v2's own theme.properties never defines
# them — it only introduced the newer kcButtonPrimaryClass/
# kcButtonSecondaryClass family. Left undefined, FreeMarker's `!` operator
# silently resolves those references to "", so the buttons on those pages
# render with none of PatternFly's button classes at all: no border, no
# background, no color, just bare unstyled text. Defining them here plugs
# that gap for every inherited template that hits it, not just the one screen
# that surfaced it.
kcButtonDefaultClass=pf-v5-c-button pf-m-primary
kcButtonLargeClass=pf-m-display-lg
