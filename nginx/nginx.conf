server {
    listen 80;
    server_name www.arbiscannerwebapp.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.arbiscannerwebapp.site;

    ssl_certificate     /etc/letsencrypt/live/www.arbiscannerwebapp.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.arbiscannerwebapp.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy REST API calls to the backend container
    location /api/ {
        proxy_pass         http://web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cookie_domain web www.arbiscannerwebapp.site;
        proxy_cookie_path   /  /;
    }

    # Proxy SignalR WebSocket hub
    location /hubs/ {
        proxy_pass         http://web:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── Admin panel SPA (served under /admin, built with --base=/admin/) ───────
    location = /admin {
        return 301 /admin/;
    }

    # Admin SPA static assets — strip the /admin/ prefix, admin-client serves from its own root
    location /admin/ {
        proxy_pass         http://admin-client:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Admin API (baseURL is built as /adminapi/api — see ADMIN_API_URL in .env) ──
    location = /adminapi {
        return 301 /adminapi/;
    }

    # Strip the /adminapi/ prefix; admin-api's own routes are already under /api/...,
    # which arrives here as the remainder of the client's /adminapi/api/... calls.
    location /adminapi/ {
        proxy_pass         http://admin-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Grafana (GF_SERVER_SERVE_FROM_SUB_PATH=true, expects the /grafana/ prefix) ──
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass         http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # ── Prometheus (--web.route-prefix=/prometheus/) — no built-in auth, gate it here ──
    location = /prometheus {
        return 301 /prometheus/;
    }

    location /prometheus/ {
        auth_basic           "Restricted";
        auth_basic_user_file  /etc/nginx/prometheus.htpasswd;

        proxy_pass         http://prometheus:9090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── RabbitMQ management UI (management.path_prefix=/rabbitmq, has its own login) ──
    location = /rabbitmq {
        return 301 /rabbitmq/;
    }

    location /rabbitmq/ {
        proxy_pass         http://rabbitmq:15672;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
