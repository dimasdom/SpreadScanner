server {
    listen 80;
    server_name www.arbiscannerwebapp.site auth.arbiscannerwebapp.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Keycloak (OIDC/OAuth2 IdP for ArbiScannerWebApp) ────────────────────────────
# Dedicated subdomain, not a path under www.arbiscannerwebapp.site: Keycloak's own
# /admin/{realm}/console paths would collide with the /admin/ route below (which
# proxies to admin-client). See keycloak/README.md for one-time setup (DNS, cert).
server {
    listen 443 ssl;
    server_name auth.arbiscannerwebapp.site;

    # Reuses the primary domain's cert directory on purpose — init-letsencrypt.sh
    # only pre-seeds a dummy cert for the primary domain before nginx's first boot,
    # so a separate live/auth.../ path would be empty and nginx would fail to start.
    # Request one SAN cert covering both hostnames instead (see keycloak/README.md).
    ssl_certificate     /etc/letsencrypt/live/www.arbiscannerwebapp.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.arbiscannerwebapp.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass         http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    server_name www.arbiscannerwebapp.site;

    ssl_certificate     /etc/letsencrypt/live/www.arbiscannerwebapp.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.arbiscannerwebapp.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy REST API calls to the backend container
    location /api/ {
        proxy_pass         http://web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cookie_domain web www.arbiscannerwebapp.site;
        proxy_cookie_path   /  /;
    }

    # Proxy SignalR WebSocket hub
    location /hubs/ {
        proxy_pass         http://web:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # Proxy ArbiScanner.AiAssistant's SignalR chat hub — same WebSocket-upgrade
    # shape as /hubs/ above, own container, same arbiscanner-web-spa bearer token
    # (see ArbiScanner.AiAssistant/README.md).
    location /ai-hub/ {
        proxy_pass         http://ai-assistant:8080/ai-hub/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── Admin panel SPA (served under /admin, built with --base=/admin/) ───────
    location = /admin {
        return 301 /admin/;
    }

    # Admin SPA static assets — strip the /admin/ prefix, admin-client serves from its own root
    location /admin/ {
        proxy_pass         http://admin-client:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Admin API (baseURL is built as /adminapi/api — see ADMIN_API_URL in .env) ──
    location = /adminapi {
        return 301 /adminapi/;
    }

    # Strip the /adminapi/ prefix; admin-api's own routes are already under /api/...,
    # which arrives here as the remainder of the client's /adminapi/api/... calls.
    location /adminapi/ {
        proxy_pass         http://admin-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Grafana (GF_SERVER_SERVE_FROM_SUB_PATH=true, expects the /grafana/ prefix) ──
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass         http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # ── Prometheus (--web.route-prefix=/prometheus/) — no built-in auth, gate it here ──
    location = /prometheus {
        return 301 /prometheus/;
    }

    location /prometheus/ {
        auth_basic           "Restricted";
        auth_basic_user_file  /etc/nginx/prometheus.htpasswd;

        proxy_pass         http://prometheus:9090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── RabbitMQ management UI (management.path_prefix=/rabbitmq, has its own login) ──
    location = /rabbitmq {
        return 301 /rabbitmq/;
    }

    location /rabbitmq/ {
        proxy_pass         http://rabbitmq:15672;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── MCP server (ArbiScanner.McpServer) — the caller's own long-lived MCP token
    # (from the "MCP Access" page) IS the bearer credential; unrelated to the site's
    # own session cookie. See ArbiScanner.McpServer/README.md. No path collision like
    # Keycloak's /admin/{realm}/console, so no dedicated subdomain needed here.
    # No trailing-slash redirect / prefix-stripping here unlike /adminapi/ — MapMcp
    # mounts at the exact path "/mcp" in the container (see Program.cs), so this
    # proxies transparently rather than rewriting anything. ──
    location = /mcp {
        proxy_pass         http://mcp-server:8080/mcp;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Streamable HTTP transport responses can be long-lived/SSE-style —
        # disable buffering and extend the read timeout, same rationale as
        # /hubs/'s WebSocket timeout above (not a WebSocket upgrade here, but
        # the same "don't let nginx cut a long-lived response short" concern).
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }

    # Hashed build assets (Vite appends a content hash to every filename under
    # /assets/) are safe to cache forever — a changed file always gets a new URL.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA fallback — serve index.html for all unmatched routes. Explicitly
    # no-cache index.html itself: it references /assets/*.<hash>.js|css by exact
    # filename, and those filenames change on every deploy. Without this, a
    # browser can keep serving a pre-deploy index.html from its heuristic HTTP
    # cache (no Cache-Control was ever set), whose <script> tag then 404s
    # against the new /assets/ contents — a blank page on refresh until the
    # user hard-reloads.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
