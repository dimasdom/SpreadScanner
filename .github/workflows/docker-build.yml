name: Docker builds

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build arbitrage-scanner image
        run: docker build -t arbitrage-scanner -f ArbitrageScanner/ArbitrageScanner.Worker/Dockerfile ArbitrageScanner

      - name: Build web API image (repo-root context)
        run: docker build -t web -f ArbiScannerWebApp/Dockerfile .

      - name: Build admin API image (repo-root context)
        run: docker build -t admin-api -f ArbiScannerAdminPannel/Dockerfile .

      - name: Build telegram-notifier image (repo-root context)
        run: docker build -t telegram-notifier -f ArbiScanner.TelegramNotifierApp/Dockerfile .

  validate-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate compose files
        run: |
          docker compose --env-file sample.env -f docker-compose.yml config -q
          docker compose --env-file sample.env -f docker-compose.yml -f docker-compose.local.yml config -q

      - name: Validate Kafka topic-init script syntax
        run: sh -n kafka/init-topics.sh

      - name: Validate Prometheus config and unit-test the Kafka alert rules
        run: >
          docker run --rm --entrypoint sh -v "$PWD/observability/prometheus:/p:ro" prom/prometheus:latest -c
          'mkdir -p /etc/prometheus/rules && cp /p/rules/* /etc/prometheus/rules/ &&
          promtool check config /p/prometheus.yaml && cd /p/rules && promtool test rules kafka.test.yaml'

      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool ArbiScannerWebApp/grafana/provisioning/dashboards/json/kafka.json > /dev/null
