name: Deploy service (reusable)

# Shared by each submodule's own .github/workflows/deploy.yml (workflow_dispatch
# callers, one per repo). Pure "ship a version" step: pulls the already-built,
# already-tested image(s) for the given version tag from GHCR and restarts the
# affected compose service(s) on the VPS via scripts/deploy-remote.sh. Does NOT
# checkout code, run tests, or build images - that happens once per release, in
# release-service.yml, triggered by release-please tagging a new version. This
# split means "deploy" always ships an exact, previously-verified artifact and
# can target any version (or "latest") without re-running the pipeline.

on:
  workflow_call:
    inputs:
      version:
        description: 'Image tag to deploy, e.g. "v1.4.0" or "latest"'
        required: true
        type: string
      deploy_services:
        description: "Space-separated docker-compose service names to restart on the VPS, in dependency order"
        required: true
        type: string
      image_tag_vars:
        description: 'JSON map of compose service name -> the *_IMAGE_TAG env var it reads, e.g. {"web":"WEB_IMAGE_TAG"}'
        required: true
        type: string
      dry_run:
        description: "When true, resolve inputs but skip the VPS deploy step entirely"
        required: false
        type: boolean
        default: false
    secrets:
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_KEY:
        required: true
      VPS_SSH_PORT:
        required: false
      VPS_DEPLOY_PATH:
        required: true

jobs:
  deploy:
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      # Resolved here (not inside the SSH script) because the runner is guaranteed to
      # have jq - the VPS isn't. Turns {"web":"WEB_IMAGE_TAG",...} into a plain
      # space-separated "web:WEB_IMAGE_TAG ..." string the remote script can split
      # with bash parameter expansion alone.
      - name: Resolve service:tag-var pairs
        id: resolve_tags
        run: |
          PAIRS=$(echo '${{ inputs.image_tag_vars }}' | jq -r 'to_entries | map("\(.key):\(.value)") | join(" ")')
          echo "pairs=$PAIRS" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            git pull --ff-only
            TAG="${{ inputs.version }}"
            for pair in ${{ steps.resolve_tags.outputs.pairs }}; do
              svc="${pair%%:*}"
              var_name="${pair##*:}"
              bash scripts/deploy-remote.sh "$svc" "$var_name" "$TAG"
            done
